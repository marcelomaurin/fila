name: Guiche full Lazarus build

concurrency:
  group: guiche-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - 'ci/**'
      - 'refactor/**'
  pull_request:
    branches:
      - master

jobs:
  guiche-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Guiche
            shared
          sparse-checkout-cone-mode: true

      - name: Install Lazarus build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y             lazarus lcl lcl-utils             fp-compiler fp-units-base fp-units-fcl fp-units-net             libgtk2.0-dev wget unzip ca-certificates

      - name: Show Lazarus versions
        run: |
          fpc -iV
          lazbuild --version

      - name: Download lNet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lazarus-deps"
          cd "$RUNNER_TEMP/lazarus-deps"

          wget --https-only --tries=3 --timeout=30             -O lnet.zip             "https://sourceforge.net/projects/lazarus-ccr/files/lNet/lNet%200.6.5/lnet-0.6.5.zip/download"
          unzip -q lnet.zip -d lnet

          echo "lNet packages found:"
          find "$RUNNER_TEMP/lazarus-deps/lnet" -type f -iname '*.lpk' -print

      - name: Build and register lNet packages
        shell: bash
        run: |
          set -euo pipefail
          PCP="$RUNNER_TEMP/lazarus-config"
          mkdir -p "$PCP"

          LNET_BASE="$(find "$RUNNER_TEMP/lazarus-deps/lnet" -type f -iname 'lnetbase.lpk' -print -quit)"
          LNET_VISUAL="$(find "$RUNNER_TEMP/lazarus-deps/lnet" -type f -iname 'lnetvisual.lpk' -print -quit)"

          test -n "$LNET_BASE"
          test -n "$LNET_VISUAL"

          lazbuild --pcp="$PCP" --widgetset=gtk2 "$LNET_BASE"
          lazbuild --pcp="$PCP" --widgetset=gtk2 --add-package-link="$LNET_BASE" "$LNET_VISUAL"
          lazbuild --pcp="$PCP" --add-package-link="$LNET_BASE"
          lazbuild --pcp="$PCP" --add-package-link="$LNET_VISUAL"

      - name: Build Guiche
        shell: bash
        run: |
          set -euo pipefail
          PCP="$RUNNER_TEMP/lazarus-config"
          LNET_BASE="$(find "$RUNNER_TEMP/lazarus-deps/lnet" -type f -iname 'lnetbase.lpk' -print -quit)"
          LNET_VISUAL="$(find "$RUNNER_TEMP/lazarus-deps/lnet" -type f -iname 'lnetvisual.lpk' -print -quit)"
          mkdir -p Guiche/lib/x86_64-linux

          lazbuild \
            --pcp="$PCP" \
            --add-package-link="$LNET_BASE" \
            --add-package-link="$LNET_VISUAL" \
            --widgetset=gtk2 \
            --build-all \
            --verbose-pkgsearch \
            Guiche/Guiche.lpi

      - name: Locate and verify Guiche binary
        shell: bash
        run: |
          set -euo pipefail

          echo "Executable candidates:"
          find . -maxdepth 4 -type f -perm /111 -print || true

          BIN="$(find . -maxdepth 4 -type f \( -name 'Guiche' -o -name 'guiche' \) -perm /111 -print -quit)"
          test -n "$BIN"

          echo "Guiche binary: $BIN"
          file "$BIN"
          echo "GUICHE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Upload Guiche Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guiche-linux-x86_64
          path: ${{ env.GUICHE_BIN }}
          if-no-files-found: error
