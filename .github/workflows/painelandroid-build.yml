name: PainelAndroid build

concurrency:
  group: painelandroid-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - 'refactor/**'
  pull_request:
    branches:
      - master

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PainelAndroid
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            PainelAndroid
          sparse-checkout-cone-mode: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: PainelAndroid
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: PainelAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PainelAndroid-debug
          path: PainelAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
